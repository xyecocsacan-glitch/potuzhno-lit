name: Build standalone Potuzhno inventory camera
on:
  push:
    branches: [glass-inventory-addon-1.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-inventory-addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build standalone camera mod
        run: gradle build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: potuzhno-inventory-camera-1.21.11
          path: |
            glass-inventory-addon/build/libs/*.jar
            !glass-inventory-addon/build/libs/*-sources.jar
            !glass-inventory-addon/build/libs/*-dev.jar
          if-no-files-found: error
