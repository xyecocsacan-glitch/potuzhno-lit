name: Client startup check
on:
  push:
    branches: ['fix-fpv-aim-range-0.6.0']
    paths: ['src/**', 'build.gradle', 'ci/check-client-start.py', '.github/workflows/client-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Prepare virtual display
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
      - name: Start actual Minecraft client with software rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
          JAVA_TOOL_OPTIONS: '-Dmixin.debug.verbose=true'
        run: |
          mkdir -p build/client-smoke
          git archive --format=zip HEAD -o build/client-smoke/project-source.zip
          set +e
          timeout --signal=TERM --kill-after=10s 180s xvfb-run -a gradle runClient --console=plain > build/client-smoke/launch.log 2>&1
          status=$?
          set -e
          echo "$status" > build/client-smoke/exit-code.txt
          if [ -f run/logs/latest.log ]; then cp run/logs/latest.log build/client-smoke/game.log; fi
          python3 ci/check-client-start.py
      - name: Save startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-startup-evidence
          path: build/client-smoke/*
          if-no-files-found: warn
          retention-days: 7
