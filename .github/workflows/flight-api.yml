name: Inspect flight API
on:
  push:
    branches: ['fix-fpv-aim-range-0.6.0']
    paths: ['ci/inspect-flight.gradle', '.github/workflows/flight-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -I ci/inspect-flight.gradle inspectFlightApi --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: flight-api
          path: build/flight-api/*.txt
          retention-days: 1
