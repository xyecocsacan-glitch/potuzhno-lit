name: Build Potuzhno Cinema mod
on:
  push:
    branches: ['potuzhno-cinema-1.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: potuzhno-cinema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build and test cinema mod
        run: gradle build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: potuzhno-cinema-1.21.11
          path: |
            potuzhno-cinema/build/libs/*.jar
            !potuzhno-cinema/build/libs/*-sources.jar
            !potuzhno-cinema/build/libs/*-dev.jar
          if-no-files-found: error
