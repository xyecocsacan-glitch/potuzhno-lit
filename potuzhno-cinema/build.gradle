plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}
version = '1.0.0'
group = 'ru.potuzhno.cinema'
base { archivesName = 'potuzhno-cinema-1.21.11' }
loom {
    splitEnvironmentSourceSets()
    mods {
        potuzhnocinema {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
test { useJUnit() }
